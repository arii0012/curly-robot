name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack app archive
        run: |
          Z=$(ls PoiPaper*.zip 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -n "$Z" ]; then
            rm -rf app
            rm -f *.kt AndroidManifest.xml colors.xml strings.xml wallpaper.xml ic_avatar.xml ic_fg.xml ic_launcher.xml
            unzip -oq "$Z"
          fi
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: "8.9" }
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: PoiPaper-apk, path: app/build/outputs/apk/debug/app-debug.apk }
