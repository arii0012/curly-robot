name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack app archive
        run: |
          Z=$(ls PoiPaper*.zip 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -n "$Z" ]; then
            rm -rf app
            rm -f *.kt AndroidManifest.xml colors.xml strings.xml wallpaper.xml ic_avatar.xml ic_fg.xml ic_launcher.xml
            unzip -oq "$Z"
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.9"

      - name: Build APK (retry transient dependency errors)
        shell: bash
        run: |
          for attempt in 1 2 3 4 5; do
            echo "Gradle build attempt $attempt/5"
            if gradle --no-daemon --max-workers=2 assembleDebug; then
              echo "Gradle build succeeded."
              exit 0
            fi

            if [ "$attempt" -lt 5 ]; then
              delay=$((attempt * 20))
              echo "Build failed. Waiting ${delay}s before retry..."
              sleep "$delay"
            fi
          done

          echo "Gradle build failed after 5 attempts."
          exit 1

      - name: Find generated APK
        id: find_apk
        shell: bash
        run: |
          echo "Searching the workspace for APK files..."
          find . -type f -name "*.apk" -print
          APK_PATH="$(find . -type f -name "*.apk" -print -quit)"
          if [ -z "$APK_PATH" ]; then
            echo "::error::Gradle finished, but no APK file was found."
            exit 1
          fi
          echo "Found APK: $APK_PATH"
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PoiPaper-apk
          path: ${{ steps.find_apk.outputs.path }}
          if-no-files-found: error
          compression-level: 0
